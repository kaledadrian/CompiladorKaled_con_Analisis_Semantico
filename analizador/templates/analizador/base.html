{% load static %}  

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Compilador - Análisis Léxico y Sintáctico{% endblock %}</title>
 
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'fontawesome/css/all.min.css' %}">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card-header {
            font-weight: bold;
        }
        #codigo {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background-color: #f8f9fa;
        }
        pre {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #dee2e6;
        }
        .tree-view {
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .tree-view ul {
            padding-left: 20px;
            border-left: 2px solid #dee2e6;
        }
        .tree-view li {
            padding: 5px 0;
            list-style: none;
        }
        .tree-view .badge {
            margin-right: 5px;
        }
        .table-responsive {
            max-height: 400px;
            overflow-y: auto;
        }
        .btn {
            margin: 5px;
        }
        .display-4 {
            font-size: 2.5rem;
        }
        @media (max-width: 768px) {
            .display-4 {
                font-size: 2rem;
            }
        }
        .navbar-brand {
            font-weight: bold;
        }
        .footer {
            margin-top: 40px;
            padding: 20px 0;
            background-color: #f8f9fa;
            text-align: center;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">
                <i class="fas fa-laptop-code"></i> Compilador - Universidad
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}"><i class="fas fa-home"></i> Inicio</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <div class="footer">
        <div class="container">
            <p class="mb-0"><i class="fas fa-book"></i> Proyecto de Compiladores - Análisis Léxico y Sintáctico</p>
            <small class="text-muted"><i class="fas fa-code"></i> Desarrollado Kaled - 2026</small>
        </div>
    </div>

    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'fontawesome/js/all.js' %}"></script>

</body>
</html>
